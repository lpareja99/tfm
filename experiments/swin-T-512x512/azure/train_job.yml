$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
# name: train_yaml

display_name: swing_tiny_final_seed_91
experiment_name: mask2former_parent_child_experiments
description: classes relabeld to not have to include null clases

# invoke completions (Ctrl+Space, Cmd+Space) to see the list of computes available
compute: azureml:${AZ_COMPUTE}
# This defines the input data to mount. The names of the items in inputs can be referenced in the command
inputs:
  input_dataset:
    type: uri_folder
    path: azureml:laura_tfm_defect_data@latest #(latest = v6)
    mode: ro_mount
  pretrained_weights:
    type: uri_file
    path: azureml:mask2former_swin_tiny_512x512_base_model@latest
    mode: ro_mount
  labels_folder: "labels_basic_defects_relabel"
  seed: 91
  
# seeds: 42, 1337, 2026, 777, 91

outputs:
  output_path:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/checkpoints/final/swin_tiny_seed_91
    mode: rw_mount

code: "../"

# change this to run my training
command: >-
  python3 azure/train_mask2former.py  
  --config config.py
  --data_root ${{inputs.input_dataset}} 
  --labels_folder ${{inputs.labels_folder}}
  --weights ${{inputs.pretrained_weights}}
  --work_dir ${{outputs.output_path}}
  --seed ${{inputs.seed}}

environment:
  image: ${ACR_REGISTRY}/roadai/laura_tfm:swin_t_child