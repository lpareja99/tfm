$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
# name: train_yaml

display_name: beit2_tiny_base_final
experiment_name: mask2former_parent_child_experiments
description: classes relabeld to not have to include null clases

# invoke completions (Ctrl+Space, Cmd+Space) to see the list of computes available
compute: azureml:${AZ_COMPUTE}
# This defines the input data to mount. The names of the items in inputs can be referenced in the command
inputs:
  input_dataset:
    type: uri_folder
    path: azureml:laura_tfm_defect_data@latest #(latest = v5)
    mode: ro_mount
  pretrained_weights:
    type: uri_file
    path: azureml:laura_tfm_beit_v2_base_mmseg_transformed_weights@latest
    #path: azureml:laura_tfm_beit_v2_large_pretrain_weights@latest
    mode: ro_mount
  labels_folder: "labels_basic_defects_relabel"


outputs:
  output_path:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/checkpoints/final/beit2_base
    mode: rw_mount

code: "../"

# change this to run my training
command: >-
  python3 azure/train_mask2former.py  
  --config config.py
  --data_root ${{inputs.input_dataset}} 
  --labels_folder ${{inputs.labels_folder}}
  --weights ${{inputs.pretrained_weights}}
  --work_dir ${{outputs.output_path}}


environment:
  image: ${ACR_REGISTRY}/roadai/laura_tfm:beit2_b_child