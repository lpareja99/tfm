$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
# name: train_yaml

display_name: hrnet_t_final
experiment_name: mask2former_parent_child_experiments
description: Train defect model for 19-02-26 dataset with augmentation with crack classes (not joined)and pretrained weights from the base model

# invoke completions (Ctrl+Space, Cmd+Space) to see the list of computes available
compute: azureml:${AZ_COMPUTE}
# This defines the input data to mount. The names of the items in inputs can be referenced in the command
inputs:
  input_dataset:
    type: uri_folder
    path: azureml:laura_tfm_defect_data@latest #(latest = v5)
    mode: ro_mount
  pretrained_weights:
    type: uri_file
    path: azureml:mask2former_r50_8xb2-512x512@latest
    mode: ro_mount
  hrnet_backbone:
    type: uri_file
    path: azureml:mask2former_backbone_hrnet@latest
    mode: ro_mount
  labels_folder: "labels_basic_defects_relabel"


outputs:
  output_path:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/checkpoints/final/hrnet_t
    mode: rw_mount

code: "../"

# change this to run my training
command: >-
  python3 azure/train_mask2former.py  
  --config config.py
  --data_root ${{inputs.input_dataset}} 
  --labels_folder ${{inputs.labels_folder}}
  --weights ${{inputs.pretrained_weights}}
  --work_dir ${{outputs.output_path}}
  --hrnet_weights ${{inputs.hrnet_backbone}}


environment:
  image: ${ACR_REGISTRY}/roadai/laura_tfm:hrnet_t_child